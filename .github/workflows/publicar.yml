# Publica automaticamente uma versão nova do sincronizador sempre que VERSAO (em
# sincronizador/financeiro.py) mudar. O GitHub compila o .exe no Windows e publica junto
# com o versao.json que o atualizador lê. O painel (pasta docs) é publicado pelo GitHub Pages.
name: Publicar versao
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  teste:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Testar leitura do PDV+
        shell: pwsh
        run: python sincronizador/testes/teste_resumo.py
  build:
    needs: teste
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sincronizador
    steps:
      - uses: actions/checkout@v4
      - name: Ler versao
        id: v
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $m = Select-String -Path financeiro.py -Pattern '^VERSAO = "([0-9.]+)"'
          $v = $m.Matches[0].Groups[1].Value
          "versao=$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { "existe=1" >> $env:GITHUB_OUTPUT; Write-Host "v$v ja publicada, nada a fazer" }
          else { "existe=0" >> $env:GITHUB_OUTPUT; Write-Host "Publicando v$v" }
          exit 0
      - uses: actions/setup-python@v5
        if: steps.v.outputs.existe == '0'
        with:
          python-version: "3.13"
      - name: Compilar e testar o .exe
        if: steps.v.outputs.existe == '0'
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt pyinstaller
          python gerar_icone.py
          python -m PyInstaller --noconfirm --onefile --windowed --name AliberFinanceiro --icon aliber.ico --add-data "aliber.ico;." --hidden-import testes.teste_resumo financeiro.py
          $p = Start-Process dist/AliberFinanceiro.exe -ArgumentList "--teste" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Host "::error::Autoteste do .exe falhou (codigo $($p.ExitCode))"; exit 1 }
          Write-Host "Autoteste do .exe: OK"
          Start-Process dist/AliberFinanceiro.exe
          Start-Sleep 12
          $procs = @(Get-Process AliberFinanceiro -ErrorAction SilentlyContinue)
          $titulo = ($procs | Where-Object { $_.MainWindowTitle } | Select-Object -First 1).MainWindowTitle
          $procs | Stop-Process -Force
          if ($titulo -notlike "Aliber Financeiro*") { Write-Host "::error::A janela nao abriu (janela='$titulo')"; exit 1 }
          Write-Host "Abertura normal: OK ($titulo)"
          $v = "${{ steps.v.outputs.versao }}"
          $notas = (Get-Content NOVIDADES.txt -Raw -ErrorAction SilentlyContinue)
          $url = "https://github.com/${{ github.repository }}/releases/download/v$v/AliberFinanceiro.exe"
          @{ versao = $v; url = $url; notas = "$notas".Trim() } | ConvertTo-Json | Set-Content -Encoding utf8 dist/versao.json
      - uses: softprops/action-gh-release@v2
        if: steps.v.outputs.existe == '0' && github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ steps.v.outputs.versao }}
          target_commitish: ${{ github.sha }}
          name: Aliber Financeiro ${{ steps.v.outputs.versao }}
          body_path: sincronizador/NOVIDADES.txt
          make_latest: true
          files: |
            sincronizador/dist/AliberFinanceiro.exe
            sincronizador/dist/versao.json
