<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="icone.png">
<meta name="theme-color" content="#143E7E">
</head>
<body>
<title>Aliber Financeiro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: barra lateral azul Aliber + área de trabalho; no celular a barra vira abas no topo.
   Vermelho Aliber só nas ações principais; estados (vencida/paga) com cores próprias. */
:root {
  --bg: #F3F6FB; --surface: #FFFFFF; --surface-2: #EAF0F8; --fg: #14203A; --muted: #5A6782; --line: #D9E1EE;
  --brand: #1B4FA0; --brand-soft: #E3ECFA; --accent: #D7262B; --accent-ink: #FFFFFF;
  --nav-bg: #143E7E; --nav-fg: #E8EFFB; --nav-muted: #A9BEE2; --nav-active: #FFFFFF; --nav-active-bg: rgba(255,255,255,.12);
  --ok: #1D7A48; --ok-soft: #E1F3E9; --warn: #A86300; --warn-soft: #FCF0DC; --bad: #B42318; --bad-soft: #FCE6E4;
  --hero: #1B4FA0; --bar: #1B4FA0; --bar-2: #8FB0E6; --grid: #E4EAF3; --shadow: 0 1px 2px rgba(20,32,58,.06), 0 6px 20px rgba(20,32,58,.06);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D1422; --surface: #141D2E; --surface-2: #1B2639; --fg: #E5EBF5; --muted: #95A3BC; --line: #28344A;
  --brand: #7AA2EA; --brand-soft: #1D2C48; --accent: #EF4F55; --accent-ink: #FFFFFF;
  --nav-bg: #0A1932; --nav-fg: #DCE6F7; --nav-muted: #8EA3C7; --nav-active: #FFFFFF; --nav-active-bg: rgba(255,255,255,.09);
  --ok: #52C88C; --ok-soft: #15301F; --warn: #F0B14D; --warn-soft: #33270F; --bad: #FF7A70; --bad-soft: #3A1715;
  --hero: #24508F; --bar: #7AA2EA; --bar-2: #3D5E96; --grid: #222D41; --shadow: 0 1px 2px rgba(0,0,0,.3);
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0D1422; --surface: #141D2E; --surface-2: #1B2639; --fg: #E5EBF5; --muted: #95A3BC; --line: #28344A;
  --brand: #7AA2EA; --brand-soft: #1D2C48; --accent: #EF4F55; --accent-ink: #FFFFFF;
  --nav-bg: #0A1932; --nav-fg: #DCE6F7; --nav-muted: #8EA3C7; --nav-active: #FFFFFF; --nav-active-bg: rgba(255,255,255,.09);
  --ok: #52C88C; --ok-soft: #15301F; --warn: #F0B14D; --warn-soft: #33270F; --bad: #FF7A70; --bad-soft: #3A1715;
  --hero: #24508F; --bar: #7AA2EA; --bar-2: #3D5E96; --grid: #222D41; --shadow: 0 1px 2px rgba(0,0,0,.3);
  color-scheme: dark }

* { box-sizing: border-box }
body { margin: 0 }
[hidden] { display: none !important }
@media print { .nav, .barra, .periodo, .demo, #toast { display: none !important } .shell { display: block } .principal { padding: 0 } .tabela { border: 0 } }
html, body { height: 100% }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--f-body); -webkit-font-smoothing: antialiased }
button, input, select, textarea { font: inherit; color: inherit }
h1, h2, h3 { font-family: var(--f-display); font-weight: 650; line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: -.01em }
.num, td.v, .kpi b { font-variant-numeric: tabular-nums }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 6px }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important } }

/* ---------- moldura */
.shell { display: grid; grid-template-columns: 236px minmax(0,1fr); min-height: 100%; background: linear-gradient(to right, var(--nav-bg) 236px, transparent 236px) }
.nav { background: var(--nav-bg); color: var(--nav-fg); display: flex; flex-direction: column; gap: 4px;
  padding-block: 20px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: 14px; position: sticky; top: 0; height: 100vh }
.marca { display: flex; align-items: baseline; gap: 6px; padding: 0 10px 18px; font-family: var(--f-display); font-size: 22px; font-weight: 650 }
.marca .a { color: #FF4D52 } .marca .f { color: var(--nav-fg); font-weight: 500 }
.nav a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; color: var(--nav-muted); text-decoration: none; font-weight: 600; font-size: 14.5px }
.nav a:hover { color: var(--nav-active) }
.nav a.on { background: var(--nav-active-bg); color: var(--nav-active) }
.nav a .ic { width: 18px; height: 18px; flex: none }
.nav .rodape { margin-top: auto; padding: 12px 10px 0; border-top: 1px solid rgba(255,255,255,.12); font-size: 12.5px; color: var(--nav-muted); display: grid; gap: 6px }
.nav .rodape button { background: none; border: 0; padding: 0; color: var(--nav-fg); text-align: left; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; font-size: 13px }
.principal { min-width: 0; padding-block: 22px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.miolo { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: minmax(0,1fr); gap: 18px }
.topo { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px }
.topo h1 { font-size: 28px }
.topo .sub { color: var(--muted); font-size: 14px; margin-top: 2px }
.demo { background: var(--warn-soft); color: var(--warn); border-radius: var(--r); padding: 10px 14px; font-size: 13.5px; font-weight: 500 }
.demo b { font-weight: 700 }

@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0,1fr); background: none }
  .nav { position: sticky; top: env(safe-area-inset-top, 0px); height: auto; flex-direction: row; align-items: center; overflow-x: auto; z-index: 20;
    padding-block: 8px; padding-right: max(14px, env(safe-area-inset-right, 0px)); gap: 2px; scrollbar-width: none }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--nav-bg) }
  .marca { padding: 0 8px 0 2px; font-size: 18px }
  .nav a { white-space: nowrap; padding: 7px 10px; font-size: 14px }
  .nav a .ic { display: none }
  .nav .rodape { display: none }
  .topo h1 { font-size: 23px }
}

/* ---------- peças */
.painel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0 }
.painel > h2 { font-size: 17px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap }
.painel > h2 small { font-family: var(--f-body); font-weight: 500; font-size: 13px; color: var(--muted) }
.grade { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)) }
.kpis { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)) }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 2px; align-content: start }
.kpi span { color: var(--muted); font-size: 12.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em }
.kpi b { font-family: var(--f-display); font-size: 26px; font-weight: 650; line-height: 1.2 }
.kpi small { color: var(--muted); font-size: 13px }
.kpi.destaque { background: var(--hero); border-color: var(--hero); color: #fff }
.kpi.destaque span, .kpi.destaque small { color: rgba(255,255,255,.82) }
.neg { color: var(--bad) } .pos { color: var(--ok) }
.kpi.destaque .neg { color: #FFD2CF }

.bt { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 8px 13px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; white-space: nowrap }
.bt:hover { border-color: var(--brand) }
.bt.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }
.bt.pri:hover { filter: brightness(1.06) }
.bt.azul { background: var(--hero); border-color: var(--hero); color: #fff }
.bt.mini { padding: 4px 9px; font-size: 13px; border-radius: 6px }
.bt.link { border: 0; background: none; padding: 4px 6px; color: var(--brand) }
.bt.perigo { color: var(--bad) }
.bt:disabled { opacity: .55; cursor: default }
.barra { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 9px; padding: 3px; gap: 2px; flex-wrap: wrap }
.seg button { border: 0; background: none; padding: 6px 11px; border-radius: 7px; font-weight: 600; font-size: 13.5px; color: var(--muted); cursor: pointer }
.seg button.on { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.08) }
label.campo { display: grid; gap: 4px; font-size: 13px; font-weight: 600; color: var(--muted) }
input[type=text], input[type=email], input[type=password], input[type=number], input[type=date], input[type=search], select, textarea {
  border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; font-size: 14.5px; color: var(--fg); min-width: 0; width: 100% }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft) }
.periodo { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.periodo .datas { display: flex; gap: 6px; align-items: center }
.periodo .datas input { width: 150px }

.tabela input[type=text] { min-width: 120px }
.tabela { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface) }
table { border-collapse: collapse; width: 100%; font-size: 14px }
th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 700; padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--surface-2); white-space: nowrap }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle }
tr:last-child td { border-bottom: 0 }
td.v, th.v { text-align: right; white-space: nowrap }
td .sec { display: block; color: var(--muted); font-size: 12.5px }
td.acoes { text-align: right; white-space: nowrap }
.cod { font-family: var(--f-mono); font-size: 12.5px; color: var(--muted) }
.pill { display: inline-block; padding: 2px 9px; border-radius: 99px; font-size: 12px; font-weight: 700; white-space: nowrap }
.pill.ok { background: var(--ok-soft); color: var(--ok) }
.pill.bad { background: var(--bad-soft); color: var(--bad) }
.pill.warn { background: var(--warn-soft); color: var(--warn) }
.pill.neu { background: var(--surface-2); color: var(--muted) }
.pill.pdv { background: var(--brand-soft); color: var(--brand) }
.vazio { padding: 28px 16px; text-align: center; color: var(--muted) }

/* DRE */
.dre td, .dre th { padding: 8px 12px }
.dre tr.grupo td { font-weight: 700; background: var(--surface-2); cursor: pointer }
.dre tr.grupo td:first-child::before { content: "▾"; display: inline-block; width: 16px; color: var(--muted); transition: transform .15s }
.dre tr.grupo.fechado td:first-child::before { transform: rotate(-90deg) }
.dre tr.conta td:first-child { padding-left: 34px; color: var(--fg) }
.dre tr.conta.zero td { color: var(--muted) }
.dre tr.total td { font-weight: 700; border-top: 2px solid var(--line); font-family: var(--f-display); font-size: 15.5px }
.dre tr.total.final td { background: var(--brand-soft); color: var(--fg); font-size: 17px }
.dre td.p { color: var(--muted); font-size: 12.5px; text-align: right; width: 70px }
.sinal { display: inline-block; width: 22px; color: var(--muted); font-family: var(--f-mono); font-size: 12px }
.nota { color: var(--muted); font-size: 13px }

/* gráficos */
.graf svg { width: 100%; height: auto; display: block }
.graf text { fill: var(--muted); font-size: 11px; font-family: var(--f-body) }
.formas { display: grid; gap: 10px }
.forma { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 2px 10px; font-size: 14px }
.forma .trilho { grid-column: 1 / -1; height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden }
.forma .trilho i { display: block; height: 100%; background: var(--bar); border-radius: 99px }
.lista-venc { display: grid }
.lista-venc > div { display: grid; grid-template-columns: minmax(0,1fr) auto auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px }
.lista-venc .q { min-width: 0; display: grid; gap: 1px }
.lista-venc > div:last-child { border-bottom: 0 }
.lista-venc .d { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px }
.lista-venc .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600 }

.dre tr.sub td { font-weight: 650; cursor: pointer; background: color-mix(in srgb, var(--surface-2) 45%, var(--surface)) }
.dre tr.sub td:first-child { padding-left: 34px }
.dre tr.sub td:first-child::before { content: "▾"; display: inline-block; width: 14px; color: var(--muted); transition: transform .15s }
.dre tr.sub.fechado td:first-child::before { transform: rotate(-90deg) }
.dre tr.conta.n3 td:first-child { padding-left: 62px }
tr.futuro td { color: var(--muted) }
.plano .s { display: grid; grid-template-columns: 52px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 9px 14px; border-top: 1px solid var(--line); font-weight: 650; font-size: 14px; background: color-mix(in srgb, var(--surface-2) 45%, var(--surface)) }
.plano .s .cod { color: var(--fg) }
.plano .s ~ .c { padding-left: 30px }
input[type=file] { font-size: 14px }
/* plano de contas */
.plano { display: grid; gap: 14px }
.plano .g { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden }
.plano .g header { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 14px; background: var(--surface-2); flex-wrap: wrap }
.plano .g header h3 { font-size: 15.5px }
.plano .c { display: grid; grid-template-columns: 52px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 8px 14px; border-top: 1px solid var(--line); font-size: 14.5px }
.plano .c.inativa .nome { color: var(--muted); text-decoration: line-through }

/* modal, aviso */
.fundo { position: fixed; inset: 0; background: rgba(10,18,34,.5); display: grid; place-items: center; z-index: 50; padding: 16px }
.caixa { background: var(--surface); border-radius: 14px; width: min(560px, 100%); max-height: calc(100% - 20px); overflow: auto; box-shadow: 0 20px 60px rgba(0,0,0,.3) }
.caixa header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px 0 }
.caixa header h2 { font-size: 20px }
.caixa form { padding: 16px 20px 20px; display: grid; gap: 12px }
.caixa .duas { display: grid; grid-template-columns: 1fr 1fr; gap: 12px }
@media (max-width: 480px) { .caixa .duas { grid-template-columns: 1fr } }
.caixa .acoes-form { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; padding-top: 4px }
.check { display: flex; gap: 8px; align-items: center; font-size: 14px; font-weight: 500; color: var(--fg) }
.x { border: 0; background: none; font-size: 22px; line-height: 1; cursor: pointer; color: var(--muted); padding: 4px }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 60; display: grid; gap: 8px; pointer-events: none }
#toast div { background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 9px; font-weight: 600; font-size: 14px; box-shadow: var(--shadow) }
#toast div.erro { background: var(--bad); color: #fff }

/* login */
.entrada { min-height: 100%; display: grid; place-items: center; padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--nav-bg) }
.entrada .caixa { width: min(400px, 100%); padding: 28px 26px; display: grid; gap: 16px }
.entrada .caixa form { padding: 0 }
.entrada .marca { padding: 0; font-size: 26px } .entrada .marca .f { color: var(--fg) }
.entrada p { margin: 0; color: var(--muted); font-size: 14px }
.carregando { display: grid; place-items: center; min-height: 60vh; color: var(--muted) }
@media (max-width: 860px) { .kpis { grid-template-columns: repeat(2, minmax(0,1fr)) } .kpi { padding: 12px } .kpi b { font-size: 19px } .kpi small { font-size: 12px } }
</style>

<div id="app"><div class="carregando">Carregando…</div></div>
<div id="toast" aria-live="polite"></div>

<script>
/* =====================================================================
   CONFIGURAÇÃO — preencher com os dados do projeto Supabase da Aliber
   (Supabase > Project Settings > API). Vazio = modo demonstração.
   ===================================================================== */
const CONFIG = {"supabaseUrl": "https://gdoklolbjrnnqcklgjtt.supabase.co", "supabaseAnon": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdkb2tsb2xianJubnFja2xnanR0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwNTY5ODQsImV4cCI6MjEwODYzMjk4NH0.YoBdRMey8JKVYR7HWeTZsRVWxOFq1L94E7nq5qtQYd0"};
const DEMO_RESUMO = /*DEMO*/null/*FIM*/;
const VERSAO_PAINEL = "2.2";

/* ---------------------------------------------------------------- utilidades */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nBRL = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" });
const brl = v => nBRL.format(Math.round((+v || 0) * 100) / 100 + 0);
const pct = v => isFinite(v) ? (v * 100).toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + "%" : "–";
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const hoje = () => iso(new Date());
const paraData = s => { const [a, m, d] = s.split("-").map(Number); return new Date(a, m - 1, d); };
const addDias = (s, n) => { const d = paraData(s); d.setDate(d.getDate() + n); return iso(d); };
const addMeses = (s, n) => { const d = paraData(s); const dia = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n);
  const ult = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); d.setDate(Math.min(dia, ult)); return iso(d); };
const inicioMes = s => s.slice(0, 8) + "01";
const fimMes = s => { const d = paraData(s); return iso(new Date(d.getFullYear(), d.getMonth() + 1, 0)); };
const dataBR = s => s ? `${s.slice(8, 10)}/${s.slice(5, 7)}/${s.slice(0, 4)}` : "";
const MESES = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
const mesCurto = s => `${MESES[+s.slice(5, 7) - 1]}/${s.slice(2, 4)}`;
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : "id-" + Math.random().toString(36).slice(2) + Date.now().toString(36));
const lerNum = s => { if (typeof s === "number") return s; s = String(s || "").trim().replace(/\s|R\$/g, "");
  if (s.includes(",")) s = s.replace(/\./g, "").replace(",", "."); const n = parseFloat(s); return isFinite(n) ? n : NaN; };
const numBR = v => (+v || 0).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
function guardar(k, v) { try { localStorage.setItem("aliberfin." + k, JSON.stringify(v)); } catch (e) {} }
function lembrar(k, padrao) { try { const v = localStorage.getItem("aliberfin." + k); return v ? JSON.parse(v) : padrao; } catch (e) { return padrao; } }
function toast(msg, erro) { const d = document.createElement("div"); d.textContent = msg; if (erro) d.className = "erro";
  $("#toast").appendChild(d); setTimeout(() => d.remove(), erro ? 6000 : 3000); }
const ICONES = {
  resumo: '<path d="M3 13h7V3H3zM14 21h7v-8h-7zM3 21h7v-5H3zM14 3v7h7V3z"/>',
  dre: '<path d="M4 4h16M4 9h16M4 14h10M4 19h6"/>',
  contas: '<rect x="3" y="5" width="18" height="15" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',

  else if (preset === "mespassado") { const m = addMeses(inicioMes(h), -1); P.ini = m; P.fim = fimMes(m); }
  else if (preset === "30d") { P.ini = addDias(h, -29); P.fim = h; }

  else { P.ini = ini || P.ini || inicioMes(h); P.fim = fim || P.fim || fimMes(h); if (P.fim < P.ini) [P.ini, P.fim] = [P.fim, P.ini]; }

/* ---------------------------------------------------------------- RESUMO */
function vResumo() {
  const P = S.periodo, d = S.d, r = calcularDRE(P.ini, P.fim, opcDRE(), d), h = hoje();
  const vend = d.vendas.filter(x => x.data >= P.ini && x.data <= P.fim);
  const qtd = vend.reduce((s, x) => s + x.qtd, 0), fat = vend.reduce((s, x) => s + +x.total, 0);
  const canc = vend.reduce((s, x) => s + x.canceladas_qtd, 0);
  const abertas = d.lancamentos.filter(l => !l.pago_em && !ehEntrada(l));
  const venc = abertas.filter(l => l.vencimento < h), sem = abertas.filter(l => l.vencimento >= h && l.vencimento <= addDias(h, 7));
  const soma = a => a.reduce((s, l) => s + +l.valor, 0);
  const saldos = d.bancos.filter(b => b.ativa).map(b => { const m = movimentosConta(b, d); return { hoje: saldoEm(b, h, d, m), futuro: m.filter(x => x.data > h && x.origem === "pdv").reduce((s, x) => s + x.valor, 0) }; });

    <div class="kpi destaque"><span>Resultado operacional</span><b class="${r.resultadoOper < 0 ? "neg" : ""}">${brl(r.resultadoOper)}</b><small>margem de contribuição ${pct(r.receita ? r.margem / r.receita : NaN)} · ${S.dre.regime === "caixa" ? "caixa" : "competência"}</small></div>
    <div class="kpi"><span>Caixa e bancos hoje</span><b class="${saldo < 0 ? "neg" : ""}">${brl(saldo)}</b><small>${aReceber ? brl(aReceber) + " a receber das maquininhas" : d.bancos.length + " conta(s)"}</small></div>

  </div>`;
}
function graficoDias(vend, ini, fim) {
  const porDia = {}; vend.forEach(x => porDia[x.data] = (porDia[x.data] || 0) + +x.total);
  let dias = []; for (let dt = ini; dt <= fim && dias.length < 400; dt = addDias(dt, 1)) dias.push(dt);
  let mensal = false;
  if (dias.length > 62) { const m = {}; dias.forEach(dt => { const k = inicioMes(dt); m[k] = (m[k] || 0) + (porDia[dt] || 0); }); dias = Object.keys(m); dias.forEach(k => porDia[k] = m[k]); mensal = true; }
  if (!vend.length) return `<div class="vazio">Nenhuma venda do PDV+ neste período.</div>`;
  const max = Math.max(1, ...dias.map(k => porDia[k] || 0));
  const passo = [500, 1000, 2000, 2500, 5000, 10000, 20000, 25000, 50000, 100000, 200000, 500000].find(p => max / p <= 4) || 1000000;
  const topo = Math.ceil(max / passo) * passo;
  const W = 900, H = 230, L = 58, B = 26, T = 10, w = (W - L - 8) / dias.length;
  const y = v => T + (H - T - B) * (1 - v / topo);
  let g = ""; for (let v = 0; v <= topo; v += passo) g += `<line x1="${L}" x2="${W - 4}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${v >= 1000 ? (v / 1000).toLocaleString("pt-BR") + " mil" : v}</text>`;
  const cada = Math.ceil(dias.length / 12);
  const barras = dias.map((k, i) => { const v = porDia[k] || 0, x = L + i * w + w * 0.15, bw = Math.max(1, w * 0.7);
    const rot = mensal ? mesCurto(k) : k.slice(8) + "/" + k.slice(5, 7);
    return `<rect x="${x}" y="${y(v)}" width="${bw}" height="${Math.max(0, H - B - y(v))}" rx="2" fill="var(--bar)"><title>${rot}: ${brl(v)}</title></rect>` +
      (i % cada === 0 ? `<text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${rot}</text>` : ""); }).join("");
  return `<div class="graf"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Faturamento por ${mensal ? "mês" : "dia"}">${g}${barras}</svg></div>`;
}
function blocoFormas(P) {
  const t = {}; S.d.pagamentos.filter(p => p.data >= P.ini && p.data <= P.fim).forEach(p => t[p.forma] = (t[p.forma] || 0) + +p.valor);
  const tot = Object.values(t).reduce((a, b) => a + b, 0); if (!tot) return `<div class="vazio">Sem recebimentos no período.</div>`;
  const nome = c => S.d.formas.find(f => f.codigo == c)?.nome || "Forma " + c;
  return `<div class="formas">${Object.entries(t).sort((a, b) => b[1] - a[1]).map(([c, v]) => `<div class="forma"><span>${esc(nome(c))}</span><b class="num">${brl(v)} <span class="nota">${pct(v / tot)}</span></b><div class="trilho"><i style="width:${(v / tot * 100).toFixed(1)}%"></i></div></div>`).join("")}</div>`;
}
function blocoVencimentos(abertas) {

function miniDRE(r) {

/* ---------------------------------------------------------------- DRE */
function vDRE() {
  const P = S.periodo, o = S.dre;
  const meses = o.mensal ? mesesDoPeriodo(P.ini, P.fim) : [];
  const colunas = meses.length > 1 ? meses.map(([a, b, m]) => ({ t: mesCurto(m), r: calcularDRE(a, b, opcDRE(), S.d) })) : [];
  const total = { t: "Total", r: calcularDRE(P.ini, P.fim, opcDRE(), S.d) }; colunas.push(total);
  const so = colunas.length === 1;
  const cel = (v, rb) => `<td class="v">${brl(v)}</td>` + (so ? `<td class="p">${rb ? pct(v / rb) : ""}</td>` : "");
  const linhaTotal = (nome, k, final) => `<tr class="total${final ? " final" : ""}"><td><span class="sinal">=</span>${nome}</td>${colunas.map(c => cel(c.r[k], c.r.receita)).join("")}</tr>`;
  const valor = (c, id) => c.r.v[id] || 0;
  const grupo = (g, sinal) => { const G = GRUPOS.find(x => x.g === g), fechado = o.fechados.includes(g);
    let h = `<tr class="grupo${fechado ? " fechado" : ""}" data-acao="dobrar" data-g="${g}"><td><span class="sinal">${sinal}</span><span class="cod">${G.cod}</span> ${G.nome}</td>${colunas.map(c => cel(c.r.grupos[g].total, c.r.receita)).join("")}</tr>`;
    if (fechado) return h;
    total.r.grupos[g].blocos.forEach((b, bi) => {
      const zeroBloco = colunas.every(c => !c.r.grupos[g].blocos[bi].total);
      if (zeroBloco && !o.zeradas) return;
      const chave = b.sub ? b.sub.codigo : g + "-soltas", mostraSub = b.sub && b.sub.codigo !== G.cod, subFechado = o.fechados.includes(chave);
      if (mostraSub) h += `<tr class="sub${subFechado ? " fechado" : ""}" data-acao="dobrar" data-g="${esc(chave)}"><td><span class="cod">${esc(b.sub.codigo)}</span> ${esc(b.sub.nome)}</td>${colunas.map(c => cel(c.r.grupos[g].blocos[bi].total, c.r.receita)).join("")}</tr>`;
      if (mostraSub && subFechado) return;
      b.contas.forEach(ct => { const zero = colunas.every(c => !valor(c, ct.id)); if (zero && !o.zeradas) return;
        const tag = ct.automatica === "cmv" ? "cadastro" : ct.automatica === "taxas" ? "automática" : ["juros_pagos", "desconto_obtido", "juros_recebidos"].includes(ct.automatica) ? "automática" : S.d.formas.some(f => f.conta_receita_id === ct.id) ? "PDV+" : "";
        h += `<tr class="conta${zero ? " zero" : ""}${mostraSub ? " n3" : ""}"><td><span class="cod">${esc(ct.codigo)}</span> ${esc(ct.nome)}${tag ? ` <span class="pill pdv">${tag}</span>` : ""}</td>${colunas.map(c => cel(valor(c, ct.id), c.r.receita)).join("")}</tr>`; });
    });
    return h; };
  const cab = `<tr><th>Conta</th>${colunas.map(c => `<th class="v">${c.t}</th>` + (so ? `<th class="v">% receita</th>` : "")).join("")}</tr>`;
  const corpo = grupo("receita", "+") + grupo("custo_variavel", "−") + linhaTotal("MARGEM DE CONTRIBUIÇÃO", "margem")
    + grupo("despesa_fixa", "−") + linhaTotal("RESULTADO OPERACIONAL", "resultadoOper", true)
    + grupo("investimento", "−") + linhaTotal("RESULTADO APÓS INVESTIMENTOS", "aposInv")
    + grupo("entrada_nop", "+") + grupo("saida_nop", "−") + linhaTotal("RESULTADO FINAL (geração de caixa)", "final", true);
  const nuvem = S.db.modo === "nuvem";
  const semTaxa = !S.d.formas.some(f => +f.taxa_percentual);
  return cabecalho("DRE gerencial", "Demonstração do resultado · " + esc(empresa()?.nome),
      `<button class="bt" data-acao="copiar-dre">Copiar para o Excel</button>${nuvem ? `<button class="bt" data-acao="baixar-dre">Baixar planilha</button><button class="bt" data-acao="imprimir">Imprimir / PDF</button>` : ""}`)
    + seletorPeriodo() + `
    <div class="barra">
      <div class="seg" role="group" aria-label="Regime"><button data-acao="dre-op" data-k="regime" data-v="competencia" class="${o.regime === "competencia" ? "on" : ""}">Competência</button><button data-acao="dre-op" data-k="regime" data-v="caixa" class="${o.regime === "caixa" ? "on" : ""}">Caixa</button></div>
      <div class="seg" role="group" aria-label="Custo dos insumos"><button data-acao="dre-op" data-k="cmv" data-v="compras" class="${o.cmv === "compras" ? "on" : ""}">Insumos pelas compras</button><button data-acao="dre-op" data-k="cmv" data-v="cadastro" class="${o.cmv === "cadastro" ? "on" : ""}">Insumos pelo cadastro</button></div>
      <label class="check"><input type="checkbox" id="dre-mensal" data-acao-change="dre-check" data-k="mensal" ${o.mensal ? "checked" : ""}> Mês a mês</label>
      <label class="check"><input type="checkbox" id="dre-zeradas" data-acao-change="dre-check" data-k="zeradas" ${o.zeradas ? "checked" : ""}> Mostrar contas zeradas</label>
    </div>
    <div class="tabela"><table class="dre" id="tabela-dre"><thead>${cab}</thead><tbody>${corpo}</tbody></table></div>
    <p class="nota">${o.regime === "competencia" ? "<b>Competência:</b> vendas pela data da venda (por forma de pagamento) e contas pelo mês a que se referem (campo Competência), pagas ou não." : "<b>Caixa:</b> só o que entrou e saiu de fato: vendas quando o dinheiro cai (cartão no prazo da maquininha, crediário quando o cliente paga) e contas pela data do pagamento."}
    ${o.cmv === "compras" ? " Os custos com insumos (3.2) são as compras lançadas." : " Os custos com insumos (3.2) usam o preço de custo cadastrado em cada produto do PDV+; as compras lançadas no 3.2 ficam fora para não contar duas vezes."}
    Juros e descontos ao pagar uma conta vão sozinhos para 6.1.5 e 6.2.5.${semTaxa ? ' A taxa de cartões (3.1.3) aparece quando você informar as taxas em <a href="#config">Configurações</a>.' : ""}</p>`;
}

function filtrarContas() {

/* Importação: lê qualquer planilha com células no formato "4.2.11 Contador" (a do modelo da Aliber/consultoria)
   e a lista abaixo de "CONTAS CAIXA/ BANCOS". */
function lerPlanilhaPlano(linhas) {
  const itens = new Map(), bancos = [];
  linhas.forEach(r => r.forEach(cel => { if (typeof cel !== "string") return;
    const m = cel.match(/^\s*(\d+(?:\.\d+)+)\s*[-–]?\s*(.*?)\s*$/); if (!m || !m[2]) return;
    itens.set(m[1], m[2].replace(/\s+/g, " ")); }));
  for (let i = 0; i < linhas.length; i++) for (let j = 0; j < linhas[i].length; j++) {
    const v = linhas[i][j]; if (typeof v !== "string" || !/BANCOS/i.test(v)) continue;
    for (let k = i + 1, vazios = 0; k < linhas.length && vazios < 2; k++) { const n = (linhas[k][j] ?? "").toString().trim();
      if (!n) { vazios++; continue; } if (/^\d+(\.\d+)+/.test(n) || /^[A-ZÁÉÍÓÚÇÃÕ /]{8,}$/.test(n)) break; vazios = 0;
      if (!/^banco\s*\d+$/i.test(n)) bancos.push(n); }
  }
  const lista = [...itens].map(([codigo, nome]) => ({ codigo, nome, sintetica: codigo.split(".").length === 2, grupo: grupoDoCodigo(codigo) })).sort(ordemCod);
  lista.forEach(x => { if (x.sintetica && !lista.some(y => y.codigo.startsWith(x.codigo + "."))) x.sintetica = false; });
  return { lista, bancos: [...new Set(bancos)] };
}

      if (!c) novas.push({ empresa_id: S.empresaId, codigo: x.codigo, nome: x.nome, grupo: x.grupo, sintetica: x.sintetica, ativa: true, automatica: null });
      else if (c.nome !== x.nome || !c.ativa) alterar.push([c, { nome: x.nome, ativa: true }]); });
    if (novas.length) S.d.plano.push(...await S.db.inserir("plano_contas", novas));
    for (const [c, d] of alterar) { await S.db.atualizar("plano_contas", { id: c.id }, d); Object.assign(c, d); }
    let desat = 0;
    if ($("#imp-desat")?.checked) { const cods = new Set(dados.lista.map(x => x.codigo));
      for (const c of S.d.plano) if (!cods.has(c.codigo) && c.ativa && !c.automatica) { await S.db.atualizar("plano_contas", { id: c.id }, { ativa: false }); c.ativa = false; desat++; } }
    const bNovos = $("#imp-bancos")?.checked ? dados.bancos.filter(n => !S.d.bancos.some(b => b.nome.toLowerCase() === n.toLowerCase())) : [];
    if (bNovos.length) S.d.bancos.push(...await S.db.inserir("contas_financeiras", bNovos.map(nome => ({ empresa_id: S.empresaId, nome, tipo: /caixa/i.test(nome) ? "caixa" : "banco", saldo_inicial: 0, data_saldo: hoje(), ativa: true }))));
    window.__importacao = null;
    toast(`${novas.length} conta(s) nova(s), ${alterar.length} renomeada(s)${desat ? ", " + desat + " desativada(s)" : ""}${bNovos.length ? ", " + bNovos.length + " caixa/banco" : ""}.`);
  }, "Importar");
}

async function lerArquivoBackup(arq) {
  const prev = $("#bk-prev"); window.__backup = null; prev.textContent = "Lendo…";
  try {
    let texto;
    if (/\.gz$/i.test(arq.name)) { if (!window.DecompressionStream) throw new Error("Este navegador não abre .gz. Use o Chrome ou o Edge atualizados.");
      texto = await new Response(arq.stream().pipeThrough(new DecompressionStream("gzip"))).text(); }
    else texto = await arq.text();
    const d = JSON.parse(texto);
    if (d.formato !== "aliber-financeiro-backup") throw new Error("Este arquivo não é um backup do Aliber Financeiro.");
    if (d.empresa?.id !== S.empresaId) throw new Error(`Este backup é da loja "${d.empresa?.nome || "?"}". Abra essa loja antes de restaurar.`);
    window.__backup = d;
    const quando = new Date(d.gerado_em);
    prev.innerHTML = `<div class="tabela"><table><tbody><tr><td>Loja</td><td><b>${esc(d.empresa.nome)}</b></td></tr>
      <tr><td>Feito em</td><td><b>${quando.toLocaleDateString("pt-BR")} às ${quando.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })}</b></td></tr>
      ${Object.entries(NOMES_BACKUP).map(([k, n]) => `<tr><td>${n}</td><td class="num">${(d[k] || []).length}</td></tr>`).join("")}</tbody></table></div>
      <div class="barra" style="margin-top:10px"><button class="bt pri" data-acao="restaurar-backup">Restaurar este backup…</button></div>`;
  } catch (e) { prev.innerHTML = `<span class="neg">${esc(e.message || "Não consegui ler o arquivo.")}</span>`; }
}
async function baixarBackup(empresaId, prefixo = "") {
  const d = await S.db.rpc("exportar_backup", { empresa: empresaId });
  const nome = (d.empresa?.nome || "loja").replace(/[^\w\-À-ú ]+/g, "").trim();
  if (S.db.modo === "nuvem") baixar(`${prefixo}AliberFinanceiro-${nome}-${new Date().toISOString().slice(0, 16).replace(/[:T]/g, "-")}.json`, JSON.stringify(d), "application/json");
  return d;
}
function formRestaurar() {
  const d = window.__backup; if (!d) return;
  abrirModal("Restaurar backup", `<p style="margin:0">Todos os dados atuais da <b>${esc(empresa()?.nome)}</b> serão trocados pelos do backup de
    <b>${new Date(d.gerado_em).toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" })}</b>. Uma cópia de como está agora será baixada antes.</p>
    <label class="campo">Para confirmar, digite o nome da loja: <b>${esc(empresa()?.nome)}</b><input type="text" id="bk-conf" required autocomplete="off"></label>`, async () => {
    if ($("#bk-conf").value.trim().toLowerCase() !== (empresa()?.nome || "").trim().toLowerCase()) throw new Error("O nome digitado não confere.");
    await baixarBackup(S.empresaId, "ANTES-DE-RESTAURAR-");
    await S.db.rpc("restaurar_backup", { empresa: S.empresaId, dados: d });
    window.__backup = null; await carregarEmpresa(); toast("Backup restaurado.");
  }, "Restaurar");
}

      <td class="v"><input type="number" min="0" max="120" id="fp-prazo-${f.codigo}" value="${f.prazo_dias}" style="width:72px;text-align:right" aria-label="Prazo"></td></tr>`).join("")}
    </tbody></table></div>
    <p class="nota">A taxa vai para 3.1.3 Taxa de cartões. "Crediário" marca a forma que só vira dinheiro quando o cliente paga. Exemplo de taxas: crédito 3,19% em 30 dias; débito 1,39% em 1 dia; Pix 0,99% na hora.</p>
    <div class="barra" style="justify-content:flex-end"><button class="bt azul" type="submit">Salvar formas de pagamento</button></div></form>
  </section>
  <section class="painel"><h2>Compras do PDV+ <small>fornecedores e contas a pagar vindos da entrada de notas</small></h2>
    ${S.d.config ? `<form data-form="compras"><div class="duas" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px">
      <label class="check" style="grid-column:1/-1"><input type="checkbox" id="cp-importar" ${S.d.config.importar_compras ? "checked" : ""}> Importar as entradas de nota e os fornecedores do PDV+</label>
      <label class="campo">Conta padrão das compras<select id="cp-conta">${opcoesPlano(S.d.config.conta_compras_id, { saida: true })}</select></label>
      <label class="campo">Paga com (padrão)<select id="cp-banco">${opcoesBancos(S.d.config.banco_compras_id)}</select></label>
      <label class="campo">Importar notas com entrada a partir de<input type="date" id="cp-desde" required value="${S.d.config.compras_desde}"></label></div>
      <p class="nota">Cada entrada de nota no PDV+ vira uma conta a pagar por boleto (parcela da NF-e), com o vencimento da nota. Sem boleto na nota, vira uma conta só, vencendo na emissão.
      O fornecedor que tiver "Conta padrão" no cadastro usa a dele. Conta paga ou editada no painel não é alterada; conta excluída aqui não volta.</p>
      <div class="barra" style="justify-content:flex-end"><button class="bt azul" type="submit">Salvar</button></div></form>`
      : `<p class="nota" style="margin:0">Aparece depois da primeira sincronização com o Aliber Financeiro 1.2 ou mais novo.</p>`}
  </section>
  <section class="painel"><h2>Sincronização com o PDV+</h2>
    <p style="margin:0 0 6px">${infoSync()}${e?.versao_sync ? ` · sincronizador v${esc(e.versao_sync)}` : ""}.</p>
    <p class="nota" style="margin:0">O programa <b>Aliber Financeiro</b> no computador do caixa envia as vendas a cada 15 minutos. Se a data acima estiver antiga, confira se o programa está aberto e com internet.</p>
    ${S.admin ? `<p style="margin:12px 0 0">Chave desta loja para o sincronizador: <code class="cod" style="font-size:14px;color:var(--fg)">${esc(e?.chave_sync)}</code> <button class="bt mini" data-acao="copiar" data-texto="${esc(e?.chave_sync)}">Copiar</button></p>` : ""}
  </section>
  <section class="painel"><h2>Sua conta</h2><p style="margin:0">Conectado como <b>${esc(S.email)}</b>.</p>
    <div class="barra" style="margin-top:10px"><button class="bt" data-acao="sair">${S.db.modo === "demo" ? "Recomeçar demonstração" : "Sair"}</button></div></section>`;
}

/* ---------------------------------------------------------------- ADMINISTRAÇÃO (equipe Aliber) */
function vAdmin() {
  return cabecalho("Administração", "Lojas clientes da Aliber, chaves do sincronizador e quem acessa cada uma.", `<button class="bt pri" data-acao="nova-empresa">+ Nova loja</button>`) + `
  <div class="tabela"><table><thead><tr><th>Loja</th><th>Última sincronização</th><th>Chave do sincronizador</th><th></th></tr></thead><tbody>
  ${S.empresas.map(e => { const atras = !e.ultima_sync || (Date.now() - new Date(e.ultima_sync)) > 864e5;
    return `<tr><td><b>${esc(e.nome)}</b><span class="sec">${esc(e.cnpj) || "&nbsp;"}</span></td>
    <td>${e.ultima_sync ? new Date(e.ultima_sync).toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" }) : "nunca"} ${atras ? '<span class="pill warn">atrasada</span>' : '<span class="pill ok">em dia</span>'}</td>
    <td><code class="cod" style="color:var(--fg)">${esc(e.chave_sync)}</code> <button class="bt mini" data-acao="copiar" data-texto="${esc(e.chave_sync)}">Copiar</button></td>
    <td class="acoes"><button class="bt mini" data-acao="usuarios" data-id="${e.id}">Acessos</button><button class="bt mini" data-acao="abrir-empresa" data-id="${e.id}">Abrir</button></td></tr>`; }).join("") || `<tr><td colspan="4" class="vazio">Nenhuma loja ainda.</td></tr>`}
  </tbody></table></div>
  <section class="painel"><h2>Como ligar uma loja nova</h2><ol style="margin:0;padding-left:20px;display:grid;gap:4px">
    <li>Clique em <b>+ Nova loja</b> e copie a chave que aparece na tabela.</li>
    <li>No computador do caixa, abra o <b>AliberFinanceiro.exe</b>, vá em <b>Configurações</b> e cole a chave.</li>
    <li>Peça para o dono abrir este painel e clicar em <b>Criar conta</b>. Depois, em <b>Acessos</b>, informe o e-mail dele.</li>
  </ol></section>`;
}
async function formUsuarios(e) {
  let us = []; try { us = await S.db.rpc("usuarios_da_empresa", { empresa: e.id }) || []; } catch (x) { toast(x.message, true); }
  abrirModal("Acessos · " + e.nome, `
    <div class="tabela"><table><tbody>${us.length ? us.map(u => `<tr><td>${esc(u.email)}</td><td class="acoes"><button type="button" class="bt mini perigo" data-acao="desvincular" data-e="${e.id}" data-email="${esc(u.email)}">Remover</button></td></tr>`).join("") : `<tr><td class="vazio">Ninguém tem acesso ainda.</td></tr>`}</tbody></table></div>
    <label class="campo">Liberar acesso para o e-mail<input type="email" id="us-email" required placeholder="dono@loja.com.br"></label>
    <p class="nota" style="margin:0">A pessoa precisa ter clicado em "Criar conta" no painel antes.</p>`, async () => {
    await S.db.rpc("vincular_usuario", { empresa: e.id, email_usuario: $("#us-email").value.trim() }); toast("Acesso liberado."); }, "Liberar acesso");
}

/* ---------------------------------------------------------------- modal e confirmação */
let aoEnviarModal = null;
function abrirModal(titulo, corpo, aoEnviar, rotulo = "Salvar") {
  fecharModal(); aoEnviarModal = aoEnviar;
  const d = document.createElement("div"); d.className = "fundo"; d.id = "modal";
  d.innerHTML = `<div class="caixa" role="dialog" aria-modal="true" aria-label="${esc(titulo)}"><header><h2>${esc(titulo)}</h2><button class="x" type="button" data-acao="fechar" aria-label="Fechar">×</button></header>
    <form data-form="modal" novalidate>${corpo}<div class="acoes-form"><button type="button" class="bt" data-acao="fechar">Cancelar</button><button type="submit" class="bt pri">${esc(rotulo)}</button></div></form></div>`;
  document.body.appendChild(d); setTimeout(() => d.querySelector("input:not([type=hidden]),select,textarea")?.focus(), 30);
}
function fecharModal() { $("#modal")?.remove(); aoEnviarModal = null; }
function confirmar(titulo, texto, rotulo, acao) {
  abrirModal(titulo, `<p style="margin:0">${texto}</p>`, acao, rotulo);
  const b = $("#modal button[type=submit]"); b.textContent = rotulo; }
async function copiar(texto, msg) {
  try { await navigator.clipboard.writeText(texto); toast(msg || "Copiado."); }
  catch (e) { abrirModal("Copie o texto", `<textarea id="copia" rows="8" readonly>${esc(texto)}</textarea><p class="nota" style="margin:0">Selecione tudo (Ctrl+A) e copie (Ctrl+C).</p>`, async () => {}, "Fechar");
    setTimeout(() => $("#copia")?.select(), 50); }
}
function baixar(nome, texto, tipo) { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["﻿" + texto], { type: tipo })); a.download = nome; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }

/* ---------------------------------------------------------------- eventos */
document.addEventListener("click", async ev => {
  const el = ev.target.closest("[data-acao]"); if (!el || el.tagName === "SELECT" || el.tagName === "INPUT") return;
  const a = el.dataset.acao, id = el.dataset.id, l = id && S.d.lancamentos.find(x => x.id === id);
  try {
    if (a === "fechar") return fecharModal();
    if (a === "acesso") return telaEntrada(el.dataset.modo);
    if (a === "sair") { await S.db.sair(); return location.reload(); }
    if (a === "recarregar") return depoisDeEntrar();
    if (a === "periodo") { definirPeriodo(el.dataset.p); return desenharConteudo(); }
    if (a === "dre-op") { S.dre[el.dataset.k] = el.dataset.v; guardar("dre2", S.dre); return desenharConteudo(); }
    if (a === "dobrar") { const g = el.dataset.g, f = S.dre.fechados; S.dre.fechados = f.includes(g) ? f.filter(x => x !== g) : [...f, g]; guardar("dre2", S.dre); return desenharConteudo(); }
    if (a === "copiar-dre") return copiar(tabelaDRETexto("\t"), "DRE copiada. Cole no Excel.");
    if (a === "baixar-dre") return baixar(`DRE ${empresa()?.nome} ${S.periodo.ini} a ${S.periodo.fim}.csv`, tabelaDRETexto(";"), "text/csv");
    if (a === "imprimir") return window.print();
    if (a === "copiar") return copiar(el.dataset.texto);
    if (a === "nova-conta") return formConta(null, false);
    if (a === "nova-entrada") return formConta(null, true);
    if (a === "editar-conta") return formConta(l);
    if (a === "pagar") return formPagar(l);
    if (a === "estornar") { const d = { pago_em: null, valor_pago: null }; await S.db.atualizar("lancamentos", { id }, d); Object.assign(l, d); toast("Baixa desfeita."); return desenharConteudo(); }
    if (a === "excluir-conta") {
      const irmas = l.grupo_parcelas ? S.d.lancamentos.filter(x => x.grupo_parcelas === l.grupo_parcelas && !x.pago_em && x.id !== l.id) : [];
      return abrirModal("Excluir lançamento", `<p style="margin:0">Excluir <b>${esc(l.descricao)}</b> de ${brl(l.valor)}, vencimento ${dataBR(l.vencimento)}?</p>
        ${l.origem === "pdv" ? '<p class="nota" style="margin:0">Esta conta veio de uma entrada de nota do PDV+. Depois de excluída, ela não volta nas próximas sincronizações.</p>' : ""}
        ${irmas.length ? `<label class="check"><input type="checkbox" id="ex-todas"> Excluir também as outras ${irmas.length} parcela(s) em aberto</label>` : ""}`, async () => {
        const alvo = [l, ...($("#ex-todas")?.checked ? irmas : [])];
        for (const x of alvo) { if (x.origem === "pdv" && x.origem_id) await S.db.inserir("pdv_ignorados", [{ empresa_id: S.empresaId, origem_id: x.origem_id }]).catch(() => {});
          await S.db.excluir("lancamentos", { id: x.id }); }
        S.d.lancamentos = S.d.lancamentos.filter(x => !alvo.includes(x)); toast(alvo.length > 1 ? `${alvo.length} lançamentos excluídos.` : "Lançamento excluído."); }, "Excluir");
    }
    if (a === "contas-status") { S.contas.status = el.dataset.v; document.querySelectorAll('[data-acao="contas-status"]').forEach(b => b.classList.toggle("on", b === el)); return desenharListaContas(); }
    if (a === "contas-tipo") { S.contas.tipo = el.dataset.v; document.querySelectorAll('[data-acao="contas-tipo"]').forEach(b => b.classList.toggle("on", b === el)); return desenharListaContas(); }
    if (a === "contas-limpar-datas") { S.contas.de = S.contas.ate = ""; return desenharConteudo(); }
    if (a === "novo-forn") return formFornecedor(null);
    if (a === "editar-forn") return formFornecedor(fornPorId(id));
    if (a === "conta-do-forn") { const f = fornPorId(id); formConta(null, false); $("#f-forn").value = f.id; if (f.conta_padrao_id && $(`#f-conta option[value="${f.conta_padrao_id}"]`)) $("#f-conta").value = f.conta_padrao_id; if (!$("#f-desc").value) $("#f-desc").value = f.nome; return; }
    if (a === "novo-subgrupo") { const G = GRUPOS.find(x => x.g === el.dataset.g); return formPlano(null, { g: G.g, pai: G.cod, sintetica: true }); }
    if (a === "nova-conta-plano") return formPlano(null, { g: el.dataset.g, pai: el.dataset.pai });
    if (a === "editar-plano") return formPlano(contaPorId(id));
    if (a === "ativar-plano") { const c = contaPorId(id); await S.db.atualizar("plano_contas", { id }, { ativa: !c.ativa }); c.ativa = !c.ativa; return desenharConteudo(); }
    if (a === "excluir-plano") { const c = contaPorId(id); return confirmar("Excluir conta do plano", `Excluir <b>${esc(c.codigo)} ${esc(c.nome)}</b>?`, "Excluir", async () => {
      await S.db.excluir("plano_contas", { id }); S.d.plano = S.d.plano.filter(x => x.id !== id); toast("Conta excluída."); }); }
    if (a === "importar-plano") return formImportar();
    if (a === "baixar-backup") { el.disabled = true; try { await baixarBackup(S.empresaId); toast(S.db.modo === "nuvem" ? "Backup baixado (pasta Downloads)." : "Backup gerado (na demonstração não baixa o arquivo)."); } finally { el.disabled = false; } return; }
    if (a === "baixar-backup-todas") { el.disabled = true; try { const todas = [];
        for (const e of S.empresas) todas.push(await S.db.rpc("exportar_backup", { empresa: e.id }));
        if (S.db.modo === "nuvem") baixar(`AliberFinanceiro-TODAS-AS-LOJAS-${hoje()}.json`, JSON.stringify({ formato: "aliber-financeiro-backup-varias", gerado_em: new Date().toISOString(), lojas: todas }), "application/json");
        toast(`Backup de ${todas.length} loja(s) gerado.`); } finally { el.disabled = false; } return; }
    if (a === "restaurar-backup") return formRestaurar();
    if (a === "restaurar-plano") { const faltam = PLANO_PADRAO.filter(p => !S.d.plano.some(c => c.codigo === p[0] || (p[4] && c.automatica === p[4])));
      if (!faltam.length) return toast("O plano já tem todas as contas padrão.");
      const novas = await S.db.inserir("plano_contas", faltam.map(([codigo, nome, grupo, sintetica, automatica]) => ({ empresa_id: S.empresaId, codigo, nome, grupo, sintetica, automatica: automatica || null, ativa: true })));
      S.d.plano.push(...novas); toast(`${novas.length} conta(s) adicionada(s).`); return desenharConteudo(); }
    if (a === "novo-banco") return formBanco(null);
    if (a === "editar-banco") return formBanco(bancoPorId(id));
    if (a === "banco-sel") { S.banco.sel = id; desenharConteudo(); return document.querySelector("#conteudo section.painel:last-child")?.scrollIntoView({ behavior: "smooth", block: "start" }); }
    if (a === "transferir") return formTransferir();
    if (a === "acerto") return formAcerto();
    if (a === "excluir-mov") { const m = S.d.movimentos.find(x => x.id === id); return confirmar("Excluir movimento", `Excluir ${m.tipo === "acerto" ? "o acerto" : "a transferência"} de ${brl(m.valor)} em ${dataBR(m.data)}?`, "Excluir", async () => {
      await S.db.excluir("movimentos", { id }); S.d.movimentos = S.d.movimentos.filter(x => x.id !== id); toast("Movimento excluído."); }); }
    if (a === "nova-empresa") return abrirModal("Nova loja", `<label class="campo">Nome da loja<input type="text" id="em-nome" required></label><label class="campo">CNPJ<input type="text" id="em-cnpj"></label>`, async () => {
      const nome = $("#em-nome").value.trim(); if (!nome) throw new Error("Informe o nome.");
      const [e] = await S.db.inserir("empresas", [{ nome, cnpj: $("#em-cnpj").value.trim() }]); S.empresas.push(e); S.empresas.sort((x, y) => x.nome.localeCompare(y.nome)); toast("Loja criada. Copie a chave para o sincronizador."); });
    if (a === "usuarios") return formUsuarios(S.empresas.find(e => e.id === id));
    if (a === "desvincular") { await S.db.rpc("desvincular_usuario", { empresa: el.dataset.e, email_usuario: el.dataset.email }); toast("Acesso removido."); return formUsuarios(S.empresas.find(e => e.id === el.dataset.e)); }
    if (a === "abrir-empresa") { await trocarEmpresa(id); location.hash = "resumo"; return; }
  } catch (e) { toast(e.message || String(e), true); }
});
document.addEventListener("change", async ev => {
  const el = ev.target, a = el.dataset.acaoChange; if (!a) return;
  if (a === "datas") { definirPeriodo("livre", $("#p-ini").value, $("#p-fim").value); return desenharConteudo(); }
  if (a === "dre-check") { S.dre[el.dataset.k] = el.checked; guardar("dre2", S.dre); return desenharConteudo(); }
  if (a === "contas-filtro") { S.contas[el.dataset.k] = el.value; return el.type === "date" ? desenharConteudo() : desenharListaContas(); }
  if (a === "empresa") return trocarEmpresa(el.value);
  if (a === "forn-conta") { const f = fornPorId(el.value); if (f?.conta_padrao_id && $(`#f-conta option[value="${f.conta_padrao_id}"]`)) $("#f-conta").value = f.conta_padrao_id; if (f && !$("#f-desc").value) $("#f-desc").value = f.nome; }
  if (a === "ler-planilha") { if (el.files[0]) lerArquivoPlano(el.files[0]); }
  if (a === "ler-backup") { if (el.files[0]) lerArquivoBackup(el.files[0]); }
  if (a === "acerto-atualiza") atualizarAcerto();
});
document.addEventListener("input", ev => { const a = ev.target.dataset.acaoInput;
  if (a === "contas-busca") { S.contas.busca = ev.target.value; desenharListaContas(); }
  if (a === "acerto-dif") atualizarAcerto(); });
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && $("#modal")) fecharModal(); });
document.addEventListener("submit", async ev => {
  const f = ev.target; ev.preventDefault();
  if (f.dataset.form === "acesso") return enviarAcesso(f);
  if (f.dataset.form === "compras") {
    try { const dados = { importar_compras: $("#cp-importar").checked, conta_compras_id: $("#cp-conta").value || null, banco_compras_id: $("#cp-banco").value || null, compras_desde: $("#cp-desde").value };
      await S.db.atualizar("config_empresa", { empresa_id: S.empresaId }, dados); Object.assign(S.d.config, dados); toast("Configuração das compras salva."); }
    catch (e) { toast(e.message, true); }
    return;
  }
  if (f.dataset.form === "formas") {
    try { for (const x of S.d.formas) { const dados = { nome: $("#fp-nome-" + x.codigo).value.trim() || x.nome, conta_receita_id: $("#fp-conta-" + x.codigo).value || null,
          conta_financeira_id: $("#fp-cf-" + x.codigo).value || null, a_prazo: $("#fp-prazo-ap-" + x.codigo).checked,
          taxa_percentual: lerNum($("#fp-taxa-" + x.codigo).value) || 0, prazo_dias: parseInt($("#fp-prazo-" + x.codigo).value) || 0 };
        if (Object.keys(dados).some(k => String(dados[k] ?? "") !== String(x[k] ?? (k === "a_prazo" ? ehAPrazo(x) : "")))) { await S.db.atualizar("formas_pagamento", { empresa_id: S.empresaId, codigo: x.codigo }, dados); Object.assign(x, dados); } }
      toast("Formas de pagamento salvas."); desenharConteudo(); } catch (e) { toast(e.message, true); }
    return;
  }
  if (f.dataset.form === "modal" && aoEnviarModal) {
    for (const el of f.querySelectorAll("[required]")) if (!el.value.trim()) { el.focus(); return toast("Preencha os campos obrigatórios.", true); }
    const b = f.querySelector("button[type=submit]"); b.disabled = true;
    try { await aoEnviarModal(); fecharModal(); desenharConteudo(); } catch (e) { toast(e.message, true); b.disabled = false; }
  }
});
async function trocarEmpresa(id) { S.empresaId = id; guardar("empresa", id); $("#conteudo") && ($("#conteudo").innerHTML = '<div class="carregando">Carregando…</div>');
  try { await carregarEmpresa(); } catch (e) { toast(e.message, true); } desenhar(); }

iniciar();
</script>
